apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
data:
  # Non-sensitive configuration
  # Why ConfigMap instead of hardcoding in Deployment?
  # 1. Change config without rebuilding the image
  # 2. Share config between multiple deployments
  # 3. ConfigMap changes (with annotation checksums) trigger pod restarts
  REDIS_HOST: {{ include "url-shortener.redisName" . | quote }}
  REDIS_PORT: "6379"
  LOG_LEVEL: {{ .Values.app.env.LOG_LEVEL | quote }}
