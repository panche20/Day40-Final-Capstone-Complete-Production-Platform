apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
type: Opaque
data:
  # In production: use Sealed Secrets or External Secrets Operator
  # to avoid storing plaintext in git.
  # For this lab: placeholder value
  APP_SECRET_KEY: {{ randAlphaNum 32 | b64enc | quote }}
