# PrometheusRule — alerting rules loaded by the Prometheus operator.
# Interview: "How do you manage alerting rules in Kubernetes?"
# PrometheusRule CRD. Prometheus operator watches and loads them.
# Rules are code — version controlled, reviewed, tested.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: url-shortener-alerts
  namespace: monitoring
  labels:
    # Must match Prometheus operator's ruleSelector
    release: prometheus
    app: kube-prometheus-stack
spec:
  groups:
  # ── Recording Rules ───────────────────────────────────────────
  # Pre-compute expensive queries on a schedule.
  # Dashboard panels query pre-computed results (fast).
  # Without recording rules: dashboard queries run live (slow).
  - name: url-shortener.recording
    interval: 30s
    rules:
    - record: job:http_requests:rate5m
      expr: |
        sum(rate(http_requests_total[5m])) by (endpoint, status_code)

    - record: job:http_error_rate:percent5m
      expr: |
        100 * sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m]))

    - record: job:http_latency_p99:rate5m
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
        )

  # ── Alerting Rules ────────────────────────────────────────────
  - name: url-shortener.alerts
    rules:
    # ── High Error Rate ─────────────────────────────────────────
    # Interview: "What is your error rate SLO and how do you alert on it?"
    # Our SLO: < 1% error rate. Alert fires at 5% (give room before breach).
    - alert: HighErrorRate
      expr: |
        (
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m]))
        ) > 0.05
      for: 2m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: "High error rate on url-shortener"
        description: |
          Error rate is {{ $value | humanizePercentage }}.
          Threshold: 5%.
          Action: Check logs and recent deployments.
        runbook_url: "https://runbooks.example.com/high-error-rate"

    # ── High Latency ────────────────────────────────────────────
    - alert: HighLatency
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
        ) > 1.0
      for: 5m
      labels:
        severity: warning
        team: platform
      annotations:
        summary: "High p99 latency"
        description: |
          p99 latency is {{ $value | humanizeDuration }}.
          Threshold: 1s.

    # ── Redis Down ──────────────────────────────────────────────
    - alert: RedisDown
      expr: redis_connected == 0
      for: 1m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: "Redis is unreachable"
        description: "url-shortener cannot connect to Redis. All write operations will fail."

    # ── Pod Crash Looping ───────────────────────────────────────
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{
          namespace="url-shortener"
        }[15m]) * 60 * 15 > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is crash-looping"
        description: |
          Pod {{ $labels.pod }} has restarted {{ $value | humanize }} times.

    # ── Deployment Replicas Mismatch ────────────────────────────
    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas{namespace="url-shortener"}
        !=
        kube_deployment_status_available_replicas{namespace="url-shortener"}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Deployment {{ $labels.deployment }} replicas mismatch"
        description: "Expected {{ $value }} replicas but not all are available."

    # ── High Memory Usage ───────────────────────────────────────
    - alert: HighMemoryUsage
      expr: |
        container_memory_working_set_bytes{
          namespace="url-shortener",
          container="app"
        }
        /
        container_spec_memory_limit_bytes{
          namespace="url-shortener",
          container="app"
        } > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage {{ $labels.pod }}"
        description: "Pod is using {{ $value | humanizePercentage }} of memory limit. Risk of OOMKill."
