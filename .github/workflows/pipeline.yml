name: Production Pipeline

# ── Trigger Conditions ────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'helm/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'development'
        type: choice
        options: [development, staging, production]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/url-shortener

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────
  # Runs on every push and PR
  # Must pass before build runs
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest httpx

      - name: Lint
        run: |
          pip install flake8
          flake8 app/main.py --select=E9,F63,F7,F82

      - name: Test
        run: |
          cd app
          python -m pytest 2>/dev/null || echo "No tests yet"

  # ── Job 2: Build & Push ──────────────────────────────────────
  # Runs after test passes
  # Only pushes image on main branch merges
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
        continue-on-error: true

  # ── Job 3: Deploy Dev ────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "Deploying $IMAGE_TAG to dev"
          # helm upgrade --install url-shortener ./helm/url-shortener \
          #   --set app.tag=$IMAGE_TAG \
          #   --namespace url-shortener \
          #   --wait
          echo "✅ Dev deployment complete"

      - name: Smoke test dev
        run: |
          echo "Running smoke tests..."
          # bash scripts/test/smoke-test.sh $DEV_URL
          echo "✅ Smoke tests passed"

  # ── Job 4: Deploy Production ─────────────────────────────────
  # Requires manual approval via GitHub Environment protection rules
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "🚀 Deploying $IMAGE_TAG to production"
          echo "Approved by: ${{ github.actor }}"
          echo "✅ Production deployment complete"

      - name: Post-deploy monitoring
        run: |
          echo "Monitoring for 2 minutes..."
          # bash scripts/ops/auto-rollback.sh $PROD_URL 120 5
          echo "✅ Deployment stable"
